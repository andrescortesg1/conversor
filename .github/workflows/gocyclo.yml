name: gocyclo
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  gocyclo:
    name: Cyclomatic complexity analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: gocyclo Analysis Reports
        uses: snkrheadz/gocyclo-analysis-reports@v0.1.1
      - name: Print gocyclo report
        run: echo "${{ env.gocyclo_report }}"
